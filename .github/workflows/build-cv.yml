name: Build CV

# Recompiles the three CV language sources in cv/ and commits the PDFs back
# to this branch so GitHub Pages always serves the latest builds:
#   cv/cv.tex     -> cv/Abdelrahman_Elsaid_Elsawy_CV.pdf      (English)
#   cv/cv_de.tex  -> cv/Abdelrahman_Elsaid_Elsawy_CV_DE.pdf   (German)
#   cv/cv_tr.tex  -> cv/Abdelrahman_Elsaid_Elsawy_CV_TR.pdf   (Turkish)

on:
  push:
    branches: [main]
    paths:
      - 'cv/**/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile CV (EN)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv.tex

      - name: Compile CV (DE)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_de.tex

      - name: Compile CV (TR)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_tr.tex

      - name: Publish PDFs
        run: |
          set -e
          mv "$(find . -name cv.pdf -print -quit)"     cv/Abdelrahman_Elsaid_Elsawy_CV.pdf
          mv "$(find . -name cv_de.pdf -print -quit)"  cv/Abdelrahman_Elsaid_Elsawy_CV_DE.pdf
          mv "$(find . -name cv_tr.pdf -print -quit)"  cv/Abdelrahman_Elsaid_Elsawy_CV_TR.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/Abdelrahman_Elsaid_Elsawy_CV.pdf cv/Abdelrahman_Elsaid_Elsawy_CV_DE.pdf cv/Abdelrahman_Elsaid_Elsawy_CV_TR.pdf
          if git diff --staged --quiet; then
            echo "PDFs unchanged"
          else
            git commit -m "Build CV PDFs [skip ci]"
            git push
          fi