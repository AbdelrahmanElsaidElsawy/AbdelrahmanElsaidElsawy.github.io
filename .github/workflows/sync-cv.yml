name: Sync CV

# CV LaTeX lives only in AbdelrahmanElsaidElsawy/cv.
# This workflow copies the built PDFs into this site for GitHub Pages.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout CV source
        uses: actions/checkout@v4
        with:
          repository: AbdelrahmanElsaidElsawy/AbdelrahmanElsaidElsawy
          path: _cv_src

      - name: Copy PDFs only
        run: |
          set -e
          mkdir -p cv
          rm -f cv/*.tex
          for f in \
            Abdelrahman_Elsaid_Elsawy_CV.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_ATS.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_DE.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_DE_ATS.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_TR.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_TR_ATS.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_FR.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_FR_ATS.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_AR.pdf \
            Abdelrahman_Elsaid_Elsawy_CV_AR_ATS.pdf
          do
            if [ -f "_cv_src/cv/$f" ]; then
              cp "_cv_src/cv/$f" "cv/$f"
            else
              echo "Missing in source (will skip until built): $f"
            fi
          done
          printf '%s\n' \
            '# CV PDFs (synced)' \
            '' \
            'LaTeX sources and the build workflow live in' \
            '[AbdelrahmanElsaidElsawy](https://github.com/AbdelrahmanElsaidElsawy/AbdelrahmanElsaidElsawy)/cv.' \
            'Do not edit PDFs here; change the `.tex` files there and let Actions rebuild,' \
            'then re-run **Sync CV** on this repo (or wait for the hourly sync).' \
            > cv/README.md

      - name: Publish synced PDFs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/*.pdf cv/README.md
          git rm -f --ignore-unmatch cv/*.tex
          if git diff --staged --quiet; then
            echo "CV PDFs unchanged"
          else
            git commit -m "Sync CV PDFs from profile repo [skip ci]"
            git push
          fi
